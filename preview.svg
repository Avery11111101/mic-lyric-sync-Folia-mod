<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Warm Editorial Paper Background -->
  <rect width="1280" height="720" fill="#F4F2EC"/>

  <!-- ==================== HEADER SECTION ==================== -->
  <g id="header" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif">
    <!-- Top-Left Eyebrow -->
    <text x="64" y="56" fill="#2C353F" font-size="12.5" font-weight="600" letter-spacing="2.2">
      FOLIA / MIC-LYRIC-SYNC
    </text>

    <!-- Main Title (Left-Aligned) -->
    <text x="64" y="110" fill="#1E2936" font-size="42" font-weight="800" letter-spacing="0.5">
      麥克風即時聽歌同步歌詞
    </text>

    <!-- Subtitle (Left-Aligned) -->
    <text x="64" y="148" fill="#757B82" font-size="18.5" font-weight="400" letter-spacing="0.3">
      Folia 模組 · 現場聽歌自動對齊全螢幕歌詞
    </text>

    <!-- Top-Right Editorial Numeral -->
    <text x="1216" y="106" text-anchor="end" fill="#A5B4C2" font-size="56" font-weight="300" letter-spacing="-1">
      03
    </text>
    <text x="1216" y="132" text-anchor="end" fill="#757B82" font-size="13" font-weight="400" letter-spacing="0.5">
      步即時同步流程
    </text>

    <!-- Hairline Divider -->
    <line x1="64" y1="176" x2="1216" y2="176" stroke="#E2DFD7" stroke-width="1"/>
  </g>

  <!-- ==================== STEP CARDS (3-COLUMN EDITORIAL FLOW) ==================== -->
  <!-- Card 1: Warm Cream Card (#ECE9E0) -->
  <g id="card-1" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif">
    <!-- External Step Label -->
    <text x="64" y="214" fill="#646A73" font-size="14" font-weight="600" letter-spacing="0.4">
      01 麥克風即時收音
    </text>

    <!-- Card Container -->
    <rect x="64" y="232" width="344" height="332" rx="14" fill="#ECE9E0" stroke="#DCD8CE" stroke-width="1"/>

    <!-- Inner Visual Stage -->
    <rect x="84" y="252" width="304" height="154" rx="10" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="1"/>

    <!-- Left Waveform Bars -->
    <g fill="#4A6D8C">
      <rect x="114" y="317" width="5" height="14" rx="2.5" opacity="0.45"/>
      <rect x="127" y="305" width="5" height="38" rx="2.5" opacity="0.7"/>
      <rect x="140" y="293" width="5" height="62" rx="2.5"/>
      <rect x="153" y="309" width="5" height="30" rx="2.5" opacity="0.65"/>
      <rect x="166" y="299" width="5" height="50" rx="2.5" opacity="0.85"/>
    </g>

    <!-- Center Microphone Vector Icon -->
    <g transform="translate(236, 323)">
      <circle cx="0" cy="-2" r="31" fill="#F4F2EC" stroke="#DCD8CE" stroke-width="1"/>
      <rect x="-7.5" y="-19" width="15" height="24" rx="7.5" fill="#1E2936"/>
      <path d="M -14 -4 A 14 14 0 0 0 14 -4" fill="none" stroke="#1E2936" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="0" y2="17" stroke="#1E2936" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="-8" y1="17" x2="8" y2="17" stroke="#1E2936" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Right Waveform Bars -->
    <g fill="#4A6D8C">
      <rect x="301" y="299" width="5" height="50" rx="2.5" opacity="0.85"/>
      <rect x="314" y="309" width="5" height="30" rx="2.5" opacity="0.65"/>
      <rect x="327" y="293" width="5" height="62" rx="2.5"/>
      <rect x="340" y="305" width="5" height="38" rx="2.5" opacity="0.7"/>
      <rect x="353" y="317" width="5" height="14" rx="2.5" opacity="0.45"/>
    </g>

    <!-- Flat Level Meter Bar -->
    <rect x="114" y="382" width="244" height="4" rx="2" fill="#E6E4DD"/>
    <rect x="114" y="382" width="164" height="4" rx="2" fill="#4A6D8C"/>

    <!-- Card 1 Title -->
    <text x="236" y="446" text-anchor="middle" fill="#1E2936" font-size="21" font-weight="700">
      麥克風即時收音
    </text>

    <!-- Card 1 Description -->
    <text x="236" y="482" text-anchor="middle" fill="#646A73" font-size="15.5" font-weight="400">
      <tspan x="236" dy="0">支援硬體裝置切換</tspan>
      <tspan x="236" dy="25">與即時音量測試</tspan>
    </text>
  </g>

  <!-- Connector Arrow 1 -->
  <g id="arrow-1">
    <line x1="422" y1="398" x2="450" y2="398" stroke="#9AA3AD" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 445 391 L 453 398 L 445 405" fill="none" stroke="#9AA3AD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Card 2: Crisp White Card (#FFFFFF) -->
  <g id="card-2" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif">
    <!-- External Step Label -->
    <text x="468" y="214" fill="#646A73" font-size="14" font-weight="600" letter-spacing="0.4">
      02 Shazam 智慧辨識
    </text>

    <!-- Card Container -->
    <rect x="468" y="232" width="344" height="332" rx="14" fill="#FFFFFF" stroke="#E2DFD7" stroke-width="1"/>

    <!-- Inner Visual Stage -->
    <rect x="488" y="252" width="304" height="154" rx="10" fill="#F7F6F2" stroke="#EAE7DF" stroke-width="1"/>

    <!-- Radar Ripples + Music Note -->
    <g transform="translate(640, 329)">
      <circle cx="0" cy="0" r="56" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 4"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#4A6D8C" stroke-width="1.5"/>

      <!-- Minimal Radar Dots -->
      <circle cx="40" cy="-6" r="3" fill="#4A6D8C"/>
      <circle cx="-39" cy="18" r="2.5" fill="#94A3B8"/>

      <!-- Music Note Icon -->
      <g transform="translate(-9, -12)">
        <path d="M 6 19 L 6 3 L 19 0 L 19 16" fill="none" stroke="#1E2936" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="3" cy="19" r="3.8" fill="#1E2936"/>
        <circle cx="16" cy="16" r="3.8" fill="#4A6D8C"/>
      </g>
    </g>

    <!-- Card 2 Title -->
    <text x="640" y="446" text-anchor="middle" fill="#1E2936" font-size="21" font-weight="700">
      Shazam 智慧辨識
    </text>

    <!-- Card 2 Description -->
    <text x="640" y="482" text-anchor="middle" fill="#646A73" font-size="15.5" font-weight="400">
      <tspan x="640" dy="0">背景自動建立隔離 Python 環境</tspan>
      <tspan x="640" dy="25">智慧平滑校時</tspan>
    </text>
  </g>

  <!-- Connector Arrow 2 -->
  <g id="arrow-2">
    <line x1="826" y1="398" x2="854" y2="398" stroke="#9AA3AD" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 849 391 L 857 398 L 849 405" fill="none" stroke="#9AA3AD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Card 3: High-Contrast Dark Charcoal Card (#181A1D) -->
  <g id="card-3" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif">
    <!-- External Step Label -->
    <text x="872" y="214" fill="#646A73" font-size="14" font-weight="600" letter-spacing="0.4">
      03 同步全螢幕歌詞
    </text>

    <!-- Card Container -->
    <rect x="872" y="232" width="344" height="332" rx="14" fill="#181A1D"/>

    <!-- Inner Visual Stage -->
    <rect x="892" y="252" width="304" height="154" rx="10" fill="#22252A"/>

    <!-- Lyric Highlight Lines -->
    <rect x="964" y="273" width="160" height="7" rx="3.5" fill="#464C56"/>

    <!-- Active Lyric Pill -->
    <rect x="922" y="294" width="244" height="32" rx="8" fill="#2C323B" stroke="#4A6D8C" stroke-width="1"/>
    <circle cx="940" cy="310" r="3.5" fill="#7EA6C9"/>
    <rect x="954" y="305.5" width="188" height="9" rx="4.5" fill="#F8FAFC"/>

    <!-- Next Lyric Line -->
    <rect x="976" y="340" width="136" height="7" rx="3.5" fill="#464C56"/>

    <!-- Flat Timeline Progress Bar -->
    <rect x="918" y="372" width="252" height="4" rx="2" fill="#3A3F47"/>
    <rect x="918" y="372" width="148" height="4" rx="2" fill="#FFFFFF"/>
    <circle cx="1066" cy="374" r="5" fill="#FFFFFF"/>
    <text x="918" y="392" fill="#8A929E" font-size="10.5" font-weight="500">01:28</text>
    <text x="1170" y="392" text-anchor="end" fill="#8A929E" font-size="10.5" font-weight="500">03:42</text>

    <!-- Card 3 Title -->
    <text x="1044" y="446" text-anchor="middle" fill="#F8FAFC" font-size="21" font-weight="700">
      同步全螢幕歌詞
    </text>

    <!-- Card 3 Description -->
    <text x="1044" y="482" text-anchor="middle" fill="#A1A7B3" font-size="15.5" font-weight="400">
      <tspan x="1044" dy="0">自動搜尋曲目 · 靜音防干擾</tspan>
      <tspan x="1044" dy="25">播畢前不重複請求</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM FEATURE PILLS ==================== -->
  <g id="bottom-pills" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif">
    <!-- Pill 1: 全域快捷鍵 ±0.5s 微調 (x=258, w=264) -->
    <rect x="258" y="612" width="264" height="42" rx="21" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1"/>
    <circle cx="282" cy="633" r="4" fill="#4A6D8C"/>
    <text x="396" y="638.5" text-anchor="middle" fill="#2C353F" font-size="15" font-weight="500">
      全域快捷鍵 ±0.5s 微調
    </text>

    <!-- Pill 2: 自動恢復播放佇列與音量 (x=546, w=276) -->
    <rect x="546" y="612" width="276" height="42" rx="21" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1"/>
    <circle cx="570" cy="633" r="4" fill="#4A6D8C"/>
    <text x="690" y="638.5" text-anchor="middle" fill="#2C353F" font-size="15" font-weight="500">
      自動恢復播放佇列與音量
    </text>

    <!-- Pill 3: 零手動部署 (x=846, w=176) -->
    <rect x="846" y="612" width="176" height="42" rx="21" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1"/>
    <circle cx="870" cy="633" r="4" fill="#4A6D8C"/>
    <text x="940" y="638.5" text-anchor="middle" fill="#2C353F" font-size="15" font-weight="500">
      零手動部署
    </text>
  </g>
</svg>