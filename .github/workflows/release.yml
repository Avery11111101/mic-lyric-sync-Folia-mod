name: Package & Release Mod

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
            echo "release_name=${TAG}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            EXISTING_TAGS=$(git tag --points-at HEAD)
            if [[ -n "$EXISTING_TAGS" ]]; then
              echo "HEAD 已有手動 Tag（${EXISTING_TAGS}），跳過自動 Hash 預發佈以避免重複。"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              SHORT_SHA=$(git rev-parse --short=7 HEAD)
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag_name=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "release_name=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Package mic-lyric-sync-mod.zip
        if: steps.meta.outputs.should_release == 'true'
        run: |
          zip -r mic-lyric-sync-mod.zip mic-lyric-sync \
            -x "*/__pycache__/*" "*.pyc" "*.pyo" "*.pyd" \
               "*/.*" "*.DS_Store" "*/Thumbs.db" "*/desktop.ini" \
               "*.log" "*.tmp" "*.bak" "*.swp" \
               "*/node_modules/*" "*/venv/*" "*/.venv/*"
          unzip -l mic-lyric-sync-mod.zip
          ls -lh mic-lyric-sync-mod.zip

      - name: Upload workflow artifact
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mic-lyric-sync-mod
          path: mic-lyric-sync-mod.zip

      - name: Create GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          files: mic-lyric-sync-mod.zip
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
