name: Package & Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package mic-lyric-sync-mod.zip
        run: |
          zip -r mic-lyric-sync-mod.zip mic-lyric-sync -x "*/__pycache__/*" "*/.*"
          ls -lh mic-lyric-sync-mod.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mic-lyric-sync-mod
          path: mic-lyric-sync-mod.zip

      - name: Determine release metadata
        id: meta
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v0\. || "$TAG" =~ -(alpha|beta|rc|pre) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mic-lyric-sync-mod.zip
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
